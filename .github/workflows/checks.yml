name: Checks

on:
  workflow_call:
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  api:
    name: API safety and session tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/pyproject.toml
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Check Python correctness
        # Existing style debt is separate from the release correctness gate.
        run: ruff check . --select E9,F63,F7,F82
      - name: Run complete API suite
        env:
          SECRET_KEY: ci-only-session-signing-key-not-for-deployment
        run: python -m pytest -v --tb=short

  web:
    name: Web lint, types and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_URL: /api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Check TypeScript
        run: npx tsc --noEmit
      - name: Build production application
        run: npm run build
